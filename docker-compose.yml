services:
  latexgen:
    build: .
    ports:
      - "8013:8000"
    environment:
      # Ollama running on the host machine (Docker Desktop resolves host.docker.internal).
      OLLAMA_URL: http://host.docker.internal:11434
      # Tiny model is plenty for text->LaTeX transcription; swap for a bigger
      # installed model (e.g. qwen3.8:27b-q8_0) if quality disappoints.
      OLLAMA_MODEL: qwen3:1.7b
      # Provider-agnostic API backend (OpenAI-compatible). Local MLX by default; for
      # AWS set OPENAI_BASE_URL=https://openrouter.ai/api/v1 + OPENAI_API_KEY + models.
      OPENAI_BASE_URL: http://host.docker.internal:8080/v1
      OPENAI_MODEL: mlx-community/Qwen3-1.7B-4bit
      # Refinement, prose and strict-mode judging. 8B is 4-5x faster than the 27B
      # and handles explicit instructions; swap in a bigger model if quality disappoints.
      OLLAMA_REFINE_MODEL: qwen3:8b
    extra_hosts:
      # Needed on Linux; harmless on Docker Desktop (mac/win).
      - "host.docker.internal:host-gateway"
