name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # tests don't need model weights
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (validator)
        run: npm test
      - name: Static build (also guards against root-absolute asset paths)
        run: node scripts/build-static.mjs
      - name: Syntax check server and frontend modules
        run: |
          node --check server.js
          node --input-type=module -e "await import('./public/validator.js').catch(e => { if (!/katex/.test(String(e))) throw e; })"
